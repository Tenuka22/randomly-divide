[package]
name = "randomly-divide"
version = "0.2.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
csv = "1.4.0"
libsql = { version = "0.10.0", default-features = false, features = ["remote", "tls"] }
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
